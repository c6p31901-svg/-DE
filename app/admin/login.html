
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者ログイン | 海岸美化財団</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: sans-serif;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 23px;
      color: #1e293b;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: bold;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2563eb;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      color: #dc2626;
      font-size: 13px;
      line-height: 1.6;
    }

    .brand {
      color: #2563eb;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">海岸美化財団</div>

    <h1>管理者ログイン</h1>
    <p class="subtitle">
      管理者アカウントでログインしてください。
    </p>

    <form id="login-form">
      <label>
        メールアドレス
        <input
          type="email"
          id="email"
          required
          autocomplete="username"
          placeholder="メールアドレス"
        >
      </label>

      <label>
        パスワード
        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
          placeholder="パスワード"
        >
      </label>

      <button type="submit" id="login-button">
        ログイン
      </button>
    </form>

    <p id="message" role="alert"></p>
  </main>

  <script type="module" src="./auth.js"></script>
</body>
</html>

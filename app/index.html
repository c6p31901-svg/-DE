<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湘南海岸美化・Web GIS リアルタイムダッシュボード</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 font-sans text-slate-100 overflow-hidden">

    <!-- 🗺️ 地図エリア -->
    <div id="leaflet-map" class="absolute inset-0 z-0"></div>

    <!-- ☰ ハンバーガーボタン -->
    <div class="absolute top-6 left-6 z-10">
        <button id="menu-open-btn" class="hamburger-btn bg-slate-900/80 p-3 rounded-xl border border-slate-700/50 shadow-lg cursor-pointer hover:bg-slate-800 transition-all">
            <i class="fa-solid fa-bars text-xl text-white"></i>
        </button>
    </div>

    <!-- ⬛ メニュー背景オーバーレイ -->
    <div id="menu-overlay" class="fixed inset-0 bg-black/60 z-20 hidden backdrop-blur-sm transition-opacity"></div>

    <!-- 📱 サイドメニュー -->
    <div id="side-menu" class="fixed top-0 left-0 h-full w-64 bg-[#232542] z-30 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col p-6">
        <!-- メニューヘッダー -->
        <div class="flex items-center gap-4 pb-4 border-b border-slate-400/40">
            <button id="menu-close-btn" class="w-8 h-8 flex items-center justify-center border border-slate-300/50 rounded text-slate-200 hover:bg-slate-700/50 cursor-pointer">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <span class="text-lg font-medium text-white tracking-wide">メニュー</span>
        </div>

        <!-- ナビゲーション項目 -->
        <nav class="flex flex-col gap-6 pt-6">
            <button id="nav-notice-btn" class="text-left text-slate-200 hover:text-white text-base font-normal tracking-wider transition-colors cursor-pointer">
                お知らせ
            </button>
            <button id="nav-trash-btn" class="text-left text-slate-200 hover:text-white text-base font-normal tracking-wider transition-colors cursor-pointer">
                ごみ一覧
            </button>
            <button id="nav-notify-btn" class="text-left text-slate-200 hover:text-white text-base font-normal tracking-wider transition-colors cursor-pointer">
                通知
            </button>
        </nav>
    </div>


    <!-- 📄 お知らせ画面 -->
    <div id="notice-page" class="fixed inset-0 bg-white text-black z-50 hidden flex-col overflow-y-auto">
        <div class="p-6">
            <button class="back-to-map-btn text-2xl text-black hover:opacity-70 p-2 cursor-pointer mb-6">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="space-y-10 max-w-2xl mx-auto pt-2">
                <div class="space-y-3">
                    <h2 class="text-xl font-bold tracking-tight">ボランティア募集活動募集</h2>
                    <div class="border-b-2 border-slate-400 w-full my-2"></div>
                    <div class="border-b-2 border-slate-400 w-full my-2"></div>
                </div>

                <div class="space-y-3">
                    <h2 class="text-xl font-bold tracking-tight">危険海岸漂着物のお知らせ</h2>
                    <div class="border-b-2 border-slate-400 w-full my-2"></div>
                    <div class="border-b-2 border-slate-400 w-full my-2"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- 🖼️ ごみ一覧機能画面 -->
    <div id="trash-page" class="fixed inset-0 bg-white text-black z-50 hidden flex-col overflow-y-auto">
        <div class="flex items-center gap-4 px-6 py-4 border-b border-slate-200 sticky top-0 bg-white z-10">
            <button class="back-to-map-btn text-2xl text-black hover:opacity-70 cursor-pointer p-1">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1 class="text-lg font-bold text-center flex-1 pr-8">ごみ一覧機能</h1>
        </div>

        <div class="p-6 max-w-2xl mx-auto w-full space-y-6">
            <div class="flex gap-4 pb-6 border-b border-slate-300 items-start">
                <div class="w-32 h-24 bg-slate-300 border border-slate-400 rounded flex items-center justify-center font-bold text-slate-700 flex-shrink-0">
                    ゴミ画像
                </div>
                <div class="flex-1 space-y-2">
                    <div class="flex justify-between text-sm text-slate-700">
                        <span>日時</span>
                        <span>放置時間</span>
                    </div>
                    <div class="space-y-2 pt-1">
                        <div class="text-sm font-semibold text-slate-800">コメント</div>
                        <div class="border-b border-slate-400 w-full"></div>
                        <div class="border-b border-slate-400 w-full"></div>
                    </div>
                </div>
            </div>

            <div class="flex gap-4 pb-6 border-b border-slate-300 items-start">
                <div class="w-32 h-24 bg-slate-300 border border-slate-400 rounded flex items-center justify-center font-bold text-slate-700 flex-shrink-0">
                    ゴミ画像
                </div>
                <div class="flex-1 space-y-2">
                    <div class="flex justify-between text-sm text-slate-700">
                        <span>日時</span>
                        <span>放置時間</span>
                    </div>
                    <div class="space-y-2 pt-1">
                        <div class="text-sm font-semibold text-slate-800">コメント</div>
                        <div class="border-b border-slate-400 w-full"></div>
                        <div class="border-b border-slate-400 w-full"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- 🔔 通知画面 -->
    <div id="notify-page" class="fixed inset-0 bg-white text-black z-50 hidden flex-col overflow-y-auto">
        <div class="flex items-center gap-4 px-6 py-4 border-b border-slate-200 sticky top-0 bg-white z-10">
            <button class="back-to-map-btn text-2xl text-black hover:opacity-70 cursor-pointer p-1">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1 class="text-lg font-bold text-center flex-1 pr-8">通知機能</h1>
        </div>
        <div class="p-6 max-w-2xl mx-auto w-full text-center text-slate-500 pt-20">
            （通知画面のデザインは準備中です）
        </div>
    </div>


    <!-- ⚙️ スクリプト -->
    <script>
        let map;

        function initMap() {
            const initialLatLng = [35.3168, 139.3940];
            
            // ズームコントロールを一旦初期化で無効化
            map = L.map('leaflet-map', {
                zoomControl: false, 
                attributionControl: false 
            }).setView(initialLatLng, 15);

            // ズームコントロールを右下に配置
            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);

            L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg", {
                maxNativeZoom: 18,
                minZoom: 11
            }).addTo(map);

            // 🟡 黄色エリア
            L.circle([35.3172, 139.3875], {
                radius: 400, color: '#eab308', fillColor: '#eab308', fillOpacity: 0.5, weight: 2
            }).addTo(map).bindPopup("<strong>西側エリア</strong><br>ゴミ量: 中");

            // 🔴 赤エリア
            L.circle([35.3168, 139.4010], {
                radius: 600, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.5, weight: 2
            }).addTo(map).bindPopup("<strong>東側エリア</strong><br>ゴミ量: 多 (優先回収エリア)");

            // 🟣 紫エリア
            L.circle([35.3168, 139.3985], {
                radius: 200, color: '#a855f7', fillColor: '#a855f7', fillOpacity: 0.6, weight: 2
            }).addTo(map).bindPopup("<strong>注射器発見要注意区域</strong>");
            
            // ⚠️ 警告マーカー
            L.marker([35.31650, 139.39850], {
                icon: L.divIcon({
                    className: 'custom-pin-danger',
                    html: '<div class="bg-red-500 text-white rounded-full p-2.5 shadow-lg border-2 border-white flex items-center justify-center w-10 h-10 animate-bounce text-sm">⚠️</div>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                })
            }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // 要素の取得
        const openBtn = document.getElementById('menu-open-btn');
        const closeBtn = document.getElementById('menu-close-btn');
        const sideMenu = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');

        const navNoticeBtn = document.getElementById('nav-notice-btn');
        const navTrashBtn = document.getElementById('nav-trash-btn');
        const navNotifyBtn = document.getElementById('nav-notify-btn');

        const noticePage = document.getElementById('notice-page');
        const trashPage = document.getElementById('trash-page');
        const notifyPage = document.getElementById('notify-page');
        const backBtns = document.querySelectorAll('.back-to-map-btn');

        // メニュー開閉
        function openMenu() {
            sideMenu.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        }

        function closeMenu() {
            sideMenu.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        }

        openBtn.addEventListener('click', openMenu);
        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        // 各ページへの移動
        function showPage(pageElement) {
            closeMenu();
            pageElement.classList.remove('hidden');
            pageElement.classList.add('flex');
        }

        // 地図画面への復帰
        function returnToMap() {
            noticePage.classList.add('hidden');
            noticePage.classList.remove('flex');

            trashPage.classList.add('hidden');
            trashPage.classList.remove('flex');

            notifyPage.classList.add('hidden');
            notifyPage.classList.remove('flex');

            closeMenu();
        }

        // イベントバインド
        navNoticeBtn.addEventListener('click', () => showPage(noticePage));
        navTrashBtn.addEventListener('click', () => showPage(trashPage));
        navNotifyBtn.addEventListener('click', () => showPage(notifyPage));

        backBtns.forEach(btn => {
            btn.addEventListener('click', returnToMap);
        });

        window.addEventListener('DOMContentLoaded', initMap);
        window.addEventListener('resize', () => { if (map) map.invalidateSize(); });
    </script>
</body>
</html>

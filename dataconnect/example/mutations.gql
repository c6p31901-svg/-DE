
mutation CreateUser(
  $lineUserId: String
  $displayName: String
  $userType: String
) @auth(level: PUBLIC) {
  user_insert(
    data: {
      lineUserId: $lineUserId
      displayName: $displayName
      userType: $userType
    }
  )
}

mutation CreateGarbageCategory(
  $categoryName: String!
  $description: String
) @auth(level: PUBLIC) {
  garbageCategory_insert(
    data: {
      categoryName: $categoryName
      description: $description
    }
  )
}

mutation CreateGarbagePost(
  $userId: UUID!
  $photoUrl: String
  $latitude: Float!
  $longitude: Float!
  $comment: String
  $garbageSize: String
  $hazardous: Boolean
  $aiResult: String
  $collectionStatus: String
) @auth(level: USER) {
  garbagePost_insert(
    data: {
      user: { userId: $userId }
      photoUrl: $photoUrl
      latitude: $latitude
      longitude: $longitude
      comment: $comment
      garbageSize: $garbageSize
      hazardous: $hazardous
      aiResult: $aiResult
      collectionStatus: $collectionStatus
    }
  )
}

mutation DeleteGarbagePost(
  $postId: UUID!
) @auth(expr: "auth.uid == 'hRlJwg9MjVcKsGm4ugvb37oxRlt2'") @transaction {
  collectionStatus_deleteMany(
    where: {
      post: {
        postId: { eq: $postId }
      }
    }
  )

  notification_deleteMany(
    where: {
      post: {
        postId: { eq: $postId }
      }
    }
  )

  garbagePost_delete(
    key: {
      postId: $postId
    }
  )
}

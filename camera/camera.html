
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>写真・位置情報記録</title>

    <link rel="stylesheet" href="./camera.css">
</head>

<body>

    <main>

        <h1>写真・位置情報記録</h1>

        <p>
            写真を撮影すると、撮影した場所の位置情報と一緒に保存します。
        </p>

        <!-- カメラ -->
        
<!-- カメラ撮影エリア -->
<section class="camera-section">
    <h2>ごみの撮影</h2>
    <p>枠内にごみ全体が収まるように撮影してください。</p>

    <button type="button" id="startCamera">
        カメラを起動
    </button>

    <div id="cameraContainer" class="camera-container"
         style="display:none;">

        <video id="cameraVideo"
               autoplay
               playsinline
               muted>
        </video>

        <!-- 撮影ガイド枠 -->
        <div class="camera-guide"></div>
    </div>

    <button type="button" id="captureButton"
            style="display:none;">
        撮影する
    </button>

    <button type="button" id="retakeButton"
            style="display:none;">
        撮り直す
    </button>

    <!-- 撮影画像 -->
    <canvas id="captureCanvas" style="display:none;"></canvas>

    <img id="preview"
         style="max-width:100%; display:none;"
         alt="撮影した画像">
</section>


        <br><br>

        <!-- プレビュー -->
        <img
            id="preview"
            style="max-width:100%; display:none;"
        >

        <br>

        
<!-- 写真の大きさの選択 -->
<section class="size-selection">
    <h2>写真に写っているものの大きさ</h2>
    <p>該当する大きさを1つ選択してください。</p>

    <div class="size-options">
        <label>
            <input type="radio" name="objectSize" value="小">
            <span>小</span>
        </label>

        <label>
            <input type="radio" name="objectSize" value="中">
            <span>中</span>
        </label>

        <label>
            <input type="radio" name="objectSize" value="大">
            <span>大</span>
        </label>
    </div>
</section>


        <button id="sendButton">
            写真を保存する
        </button>

        <p id="status"></p>

    </main>

    <script type="module" src="./script.js"></script>

</body>

</html>


<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>写真・位置情報記録</title>

  <script type="module" crossorigin src="/assets/camera-4K1C75AS.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm-DT7gI91q.js">
  <link rel="stylesheet" crossorigin href="/assets/camera-DBTZnpW3.css">
</head>

<body>

    <main>

        <h1>写真・位置情報記録</h1>

        <p>
            写真を撮影すると、撮影した場所の位置情報と一緒に保存します。
        </p>

        <!-- カメラ -->
        <input
            type="file"
            id="photo"
            accept="image/*"
            capture="environment"
        >

        <br><br>

        <!-- プレビュー -->
        <img
            id="preview"
            style="max-width:100%; display:none;"
        >

        <br>

        <button id="sendButton">
            写真を保存する
        </button>

        <p id="status"></p>

    </main>


</body>

</html>

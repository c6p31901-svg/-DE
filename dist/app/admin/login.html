
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者ログイン | 海岸美化財団</title>

  <style>*{box-sizing:border-box}body{background:#f1f5f9;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;font-family:sans-serif;display:flex}.login-card{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:40px;box-shadow:0 8px 30px #00000014}h1{color:#1e293b;margin-bottom:8px;font-size:23px}.subtitle{color:#64748b;margin-bottom:30px;font-size:14px}label{color:#334155;margin-bottom:18px;font-size:14px;font-weight:700;display:block}input{border:1px solid #cbd5e1;border-radius:8px;width:100%;margin-top:8px;padding:13px;font-size:15px}input:focus{border-color:#2563eb;outline:2px solid #2563eb}button{color:#fff;cursor:pointer;background:#2563eb;border:none;border-radius:8px;width:100%;padding:14px;font-size:15px;font-weight:700}button:disabled{opacity:.6;cursor:not-allowed}#message{color:#dc2626;margin-top:18px;font-size:13px;line-height:1.6}.brand{color:#2563eb;margin-bottom:12px;font-size:13px;font-weight:700}</style>
  <script type="module" crossorigin src="/assets/app/admin/login-DBGcGw-N.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/index.esm-B6uBLM-Y.js">
  <link rel="modulepreload" crossorigin href="/assets/firebase-Dmbm78D9.js">
</head>

<body>
  <main class="login-card">
    <div class="brand">海岸美化財団</div>

    <h1>管理者ログイン</h1>
    <p class="subtitle">
      管理者アカウントでログインしてください。
    </p>

    <form id="login-form">
      <label>
        メールアドレス
        <input
          type="email"
          id="email"
          required
          autocomplete="username"
          placeholder="メールアドレス"
        >
      </label>

      <label>
        パスワード
        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
          placeholder="パスワード"
        >
      </label>

      <button type="submit" id="login-button">
        ログイン
      </button>
    </form>

    <p id="message" role="alert"></p>
  </main>

</body>
</html>
